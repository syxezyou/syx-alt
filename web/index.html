<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ALT · Interactions RP</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main id="wheel" class="wheel-overlay" hidden>
        <div id="dial" class="dial" role="group" aria-label="Actions de rôle">
            <svg id="sectors" class="sectors" viewBox="0 0 400 400" aria-hidden="true"></svg>
            <div id="actions" class="actions"></div>
            <button id="close" class="hub" type="button" aria-label="Fermer la roue">
                <span class="hub-key">ALT</span>
                <span>INTERACTIONS</span>
                <small>Échap pour fermer</small>
            </button>
        </div>
    </main>
    <section id="target" class="target" aria-label="Ciblage" hidden>
        <span class="reticle" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.4"/></svg>
        </span>
        <div id="target-panel" class="target-panel" hidden>
            <div class="target-title">À PORTÉE</div>
            <ol id="options"></ol>
            <div class="target-hint"><kbd>E</kbd> ou clic <span>·</span> Molette pour choisir</div>
        </div>
    </section>
    <output id="notice" class="notice" aria-live="polite" hidden></output>
</body>
</html>
